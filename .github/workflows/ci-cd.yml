name: Spring Boot CI/CD Pipeline

# Kích hoạt pipeline khi có code được Push hoặc tạo Pull Request vào nhánh 'main'
on:
  push:
    branches: [ "main, develop" ]
  pull_request:
    branches: [ "main, develop" ]

jobs:
  # Phần CI: Xây dựng và kiểm thử ứng dụng
  build:
    runs-on: ubuntu-latest # Chạy trên máy ảo Ubuntu

    steps:
    # Bước 1: Clone code từ GitHub về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt môi trường Java (ở đây dùng JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' # Bản phân phối Java phổ biến và ổn định
        cache: maven # Cache lại các thư viện Maven để lần chạy sau nhanh hơn

    # Bước 3: Build dự án và chạy Unit Test bằng Maven
    - name: Build and Test with Maven
      run: mvn clean package

    # (Tùy chọn) Bước 4: Lưu lại file .jar đã build thành Artifact để tải xuống hoặc dùng cho CD
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: target/*.jar